include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
  errors:
    # Generated freezed/json code needs these annotations on constructor params.
    invalid_annotation_target: ignore

linter:
  rules:
    # This is an app, not a package: documenting every public member is overkill.
    public_member_api_docs: false
    # The new Dart 3.13 constructor syntax (`new(...)`). Freezed and its docs
    # use the classic one, so we keep a single style everywhere.
    unnecessary_type_name_in_constructor: false
