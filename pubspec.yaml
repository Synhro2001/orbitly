name: orbitly
description: "Orbitly: a messenger for close friends who orbit your planet."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  build_runner: ^2.16.2
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
