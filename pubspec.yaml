name: orbitly
description: "Orbitly — мессенджер для близких друзей: друзья вращаются вокруг твоей планеты."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
