targets:
  $default:
    builders:
      json_serializable:
        options:
          # Supabase/Postgres return snake_case.
          field_rename: snake
          explicit_to_json: true
      # The analyzer checks .g.dart as part of the library; exclude does not help.
      source_gen:combining_builder:
        options:
          ignore_for_file:
            - document_ignores
            - lines_longer_than_80_chars
            - unnecessary_null_checks
            - specify_nonobvious_property_types
